<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocDailyMar - Tahap 12 Reporting Test</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}.wrap{width:min(1000px,calc(100% - 24px));margin:24px auto}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin-bottom:12px}h1{font-size:1.35rem;margin:0 0 6px}p{font-size:.8rem;color:#667085;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a{min-height:42px;border:0;border-radius:9px;padding:9px 13px;background:#0d2240;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.secondary{background:#fff;color:#172033;border:1px solid #e4e7ec}pre{background:#101828;color:#f2f4f7;padding:12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.73rem;line-height:1.55}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/cloud-auth.js?v=15.0"></script>
<script src="js/cloud-session.js?v=6.0"></script>
<script src="js/returns-service.js?v=10.0"></script>
<script src="js/reporting-service.js?v=12.0"></script>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>⚡ Tahap 12 - Cloud Reporting Test</h1>
        <p>Buka di Device A. Lakukan transaksi, Closing, EOD, atau Pengeluaran dari Device B. Cache Device A harus ikut berubah lewat Realtime.</p>
        <div class="actions">
            <button onclick="start()">Start / Refresh</button>
            <a class="secondary" href="dashboard.html">Dashboard</a>
            <a class="secondary" href="shift-closing.html">Closing</a>
            <a class="secondary" href="eod.html">EOD</a>
        </div>
    </div>
    <div class="card"><pre id="result">Belum dimulai.</pre></div>
</div>
<script>
let events=0;
function arr(key){try{const a=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(a)?a:[]}catch{return []}}
function out(text){result.textContent=text}
async function render(label){
    const context=await LDMCloudSession.ensureAuthenticated({registerDevice:false});
    out([
        label,"",
        `User        : ${context.profile.username}`,
        `Role        : ${context.profile.role}`,
        `Store       : ${context.profile.store_code}`,
        `Transactions: ${arr("laporan").length}`,
        `Returns     : ${arr("dataRetur").length}`,
        `Closings    : ${arr("shiftClosingLog").length}`,
        `EOD         : ${arr("endOfDayLog").length}`,
        `Expenses    : ${arr("operasional").length}`,
        `Cash Moves  : ${arr("mutasiKasShift").length}`,
        `Events      : ${events}`,
        `Cloud Active: ${LDMReporting.isEnabled()?"YA":"BELUM / LEGACY PENDING"}`
    ].join("\n"));
}
async function start(){
    try{
        await LDMReporting.refreshAll();
        await LDMReporting.startRealtime();
        await render("✅ CLOUD REPORTING AKTIF");
    }catch(error){out("❌ TEST GAGAL\n\n"+(error?.message||String(error)))}
}
window.addEventListener("ldm-reporting-cache-updated",async()=>{events+=1;await render("⚡ REPORTING CACHE DIPERBARUI")});
document.addEventListener("DOMContentLoaded",start);
</script>
</body>
</html>
