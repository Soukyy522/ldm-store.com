<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Payment Gateway - LocDailyMar</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}.wrap{width:min(1180px,calc(100% - 24px));margin:22px auto}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 26px rgba(16,24,40,.045)}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:1.35rem;margin:0}h2{font-size:1rem;margin:0 0 10px}p{color:#667085;font-size:.78rem;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.plan{display:flex;flex-direction:column;min-height:330px}.plan.featured{border:2px solid #0f9d58}.price{font-size:1.4rem;font-weight:900;margin:8px 0}.muted{color:#667085}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:.66rem;font-weight:800}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;flex-wrap:wrap}.btn,button,a.btn{border:0;border-radius:10px;padding:10px 13px;background:#0d2240;color:white;text-decoration:none;font-weight:800;cursor:pointer;font-size:.76rem}.secondary{background:white!important;color:#172033!important;border:1px solid #d0d5dd!important}.green{background:#0f9d58!important}.btn:disabled,button:disabled{opacity:.55;cursor:not-allowed}.features{padding-left:18px;font-size:.75rem;line-height:1.8;color:#344054}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px;font-size:.72rem}th,td{padding:9px;border-bottom:1px solid #e4e7ec;text-align:left}.msg{white-space:pre-wrap;font-size:.76rem}.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.kpi>div{border:1px solid #e4e7ec;border-radius:12px;padding:12px}.kpi strong{display:block;font-size:1rem;margin-top:5px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}@media(max-width:600px){.grid,.kpi{grid-template-columns:1fr}.wrap{margin:12px auto}.card{padding:14px}.checkout{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.checkout{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script src="js/cloud-auth.js?v=15.0"></script><script src="js/cloud-session.js?v=6.0"></script><script src="js/cloud-session-guard.js?v=15.0"></script><script src="js/license-service.js?v=23.0"></script></head><body><div class="wrap"><div class="card top"><div><h1>💳 Payment Gateway</h1><p>Midtrans Snap. Server Key hanya berada di Supabase Edge Function, tidak di browser.</p></div><a class="btn secondary" href="license.html">← Paket</a></div><div class="checkout"><div class="card"><h2>Ringkasan</h2><div id="summary">Memuat...</div></div><div class="card"><h2>Bayar</h2><p>Tekan tombol di bawah untuk membuat order pembayaran. Status lisensi hanya dianggap aktif setelah webhook/server memverifikasi pembayaran.</p><button id="payBtn" class="green" onclick="pay()">Buat Pembayaran Midtrans</button><div class="row" style="margin-top:8px"><button id="checkBtn" class="secondary" onclick="checkLast()" disabled>Cek Status Terakhir</button></div><div id="msg" class="msg" style="margin-top:12px"></div></div></div></div><script>
const q=new URLSearchParams(location.search);const planCode=q.get("plan")||"warung-sederhana";const cycle=q.get("cycle")||"monthly";let plan,lastPayment=null;function show(t,e=false){const el=document.getElementById("msg");el.textContent=t;el.style.color=e?"#991b1b":"#166534"}function loadSnap(clientKey,environment){return new Promise((resolve,reject)=>{if(window.snap)return resolve();const s=document.createElement("script");s.src=environment==="production"?"https://app.midtrans.com/snap/snap.js":"https://app.sandbox.midtrans.com/snap/snap.js";s.setAttribute("data-client-key",clientKey);s.onload=()=>resolve();s.onerror=()=>reject(new Error("Snap JS gagal dimuat."));document.head.appendChild(s)})}function cycleText(){return cycle==="monthly"?"Bulanan":cycle==="yearly"?"Tahunan":"Lifetime"}function amount(){return cycle==="monthly"?plan?.monthly_price:cycle==="yearly"?plan?.yearly_price:plan?.lifetime_price}async function init(){try{if(LDMLicense.role()!=="owner")throw new Error("Hanya Owner yang dapat melakukan pembayaran.");const plans=await LDMLicense.plans();plan=plans.find(p=>p.code===planCode);if(!plan)throw new Error("Paket tidak ditemukan.");document.getElementById("summary").innerHTML=`<h2>${plan.name}</h2><p>Siklus: <strong>${cycleText()}</strong></p><div class="price">${LDMLicense.formatRupiah(amount())}</div><p>Kuota: ${plan.max_devices} device · ${plan.max_stores} toko</p>`}catch(e){show("❌ "+(e.message||String(e)),true);document.getElementById("payBtn").disabled=true}}async function pay(){const btn=document.getElementById("payBtn");btn.disabled=true;btn.textContent="Membuat order...";try{const r=await LDMLicense.createPayment(planCode,cycle);lastPayment=r.payment_id;document.getElementById("checkBtn").disabled=false;show(`Order ${r.order_id} dibuat. Nominal ${LDMLicense.formatRupiah(r.amount)}.`);await loadSnap(r.client_key,r.environment);if(window.snap){window.snap.pay(r.snap_token,{onSuccess:()=>{show("Pembayaran selesai di Snap. Menunggu verifikasi webhook...");setTimeout(checkLast,1800)},onPending:()=>show("Pembayaran masih pending. Selesaikan pembayaran lalu tekan Cek Status."),onError:()=>show("Pembayaran gagal/cancel dari Snap.",true),onClose:()=>show("Jendela pembayaran ditutup. Order tetap dapat dicek jika sudah dibuat.")})}else if(r.redirect_url)location.href=r.redirect_url}catch(e){show("❌ "+(e.message||String(e)),true)}finally{btn.disabled=false;btn.textContent="Buat Pembayaran Midtrans"}}async function checkLast(){if(!lastPayment)return;try{const r=await LDMLicense.checkPayment(lastPayment);show(`Status: ${r.status} / ${r.provider_status}`);if(r.status==="paid")setTimeout(()=>location.href="license.html?payment=paid",900)}catch(e){show("❌ "+(e.message||String(e)),true)}}document.addEventListener("DOMContentLoaded",init);
</script></body></html>
