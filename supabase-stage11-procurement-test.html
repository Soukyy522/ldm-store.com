<!DOCTYPE html>
<html lang="id">
<head>
    <script src="js/storage-engine.js?v=27.7.1"></script>
    <script src="js/storage-quota-guard.js?v=27.7.1"></script>
    <script defer src="js/storage-health-monitor.js?v=27.7.1"></script>
<script src="js/local-time.js?v=26.4.0"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LocDailyMar - Tahap 11 Procurement Test</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}.wrap{width:min(980px,calc(100% - 24px));margin:24px auto}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin-bottom:12px}h1{font-size:1.3rem;margin:0 0 6px}p{font-size:.8rem;color:#667085;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a{min-height:42px;border:0;border-radius:9px;padding:9px 13px;background:#0d2240;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.secondary{background:#fff;color:#172033;border:1px solid #e4e7ec}pre{background:#101828;color:#f2f4f7;padding:12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.72rem;line-height:1.55}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script>
<script src="js/cloud-auth.js?v=15.0"></script><script src="js/cloud-session.js?v=6.0"></script>
<script src="js/products-service.js?v=11.0"></script><script src="js/procurement-service.js?v=11.0"></script>
<script src="js/license-v2-config.js?v=25.2.0"></script>
<script src="js/license-v2-client.js?v=25.2.0"></script>
<script defer src="js/license-v2-guard.js?v=25.2.0"></script>
</head>
<body>
<div class="wrap">
<div class="card"><h1>⚡ Tahap 11 - Procurement Realtime Test</h1><p>Buka ini di Device A. Buat/edit Supplier, PO, atau Goods Receipt dari Device B. Counter Realtime harus bergerak dan cache ikut berubah.</p><div class="actions"><button onclick="start()">Start / Refresh</button><a class="secondary" href="supplier.html">Supplier</a><a class="secondary" href="Purchase-Order.html">PO</a><a class="secondary" href="goods.receipt.html">GR</a></div></div>
<div class="card"><pre id="result">Belum dimulai.</pre></div>
</div>
<script>
let events=0;
function rows(key){try{const x=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(x)?x:[]}catch{return[]}}
function out(v){document.getElementById("result").textContent=v}
async function render(label){
    const context=await LDMCloudSession.ensureAuthenticated({registerDevice:false});
    const suppliers=rows("dataSupplier"),po=rows("dataPurchaseOrder"),gr=rows("dataGoodsReceipt"),products=rows("dataBarang");
    out([
        label,"",
        `Role             : ${context.profile.role}`,
        `Store            : ${context.profile.store_code}`,
        `Realtime Events  : ${events}`,
        `Supplier Cache   : ${suppliers.length}`,
        `PO Cache         : ${po.length}`,
        `GR Cache         : ${gr.length}`,
        `Product Cache    : ${products.length}`,
        "",
        "PO TERBARU:",
        ...po.slice(0,5).map(x=>`${x.nomorPO} | ${x.supplier} | ${x.status} | ${x.totalReceived}/${x.totalQty}`),
        "",
        "GR TERBARU:",
        ...gr.slice(0,5).map(x=>`${x.nomorGR} | ${x.supplier} | ${x.status} | qty ${x.totalQty}`)
    ].join("\n"));
}
async function start(){
    try{
        if(window.LDMProducts) await LDMProducts.refreshCache();
        await LDMProcurement.refreshAll({force:true});
        await LDMProcurement.startRealtime();
        await render("✅ PROCUREMENT CLOUD AKTIF");
    }catch(error){out("❌ TEST GAGAL\n\n"+(error.message||String(error)))}
}
window.addEventListener("ldm-procurement-cache-updated",async()=>{events+=1;await render("⚡ PROCUREMENT CACHE DIPERBARUI")});
document.addEventListener("DOMContentLoaded",start);
</script>
</body></html>
