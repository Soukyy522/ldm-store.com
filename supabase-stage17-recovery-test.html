<head>
<script src="js/local-time.js?v=26.4.0"></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test TAHAP 17 - LocDailyMar</title>
    <style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#eef4f2;color:#172033;font:14px/1.5 system-ui}.wrap{max-width:900px;margin:auto}.card{background:#fff;border:1px solid #dce6e2;border-radius:15px;padding:18px;margin-bottom:14px}button,a{border:0;border-radius:9px;padding:10px 13px;font-weight:800;text-decoration:none;background:#0f9d58;color:#fff;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;margin:3px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.pass{background:#dcfce7;color:#166534}.fail{background:#fee2e2;color:#991b1b}.warn{background:#fef3c7;color:#92400e}pre{white-space:pre-wrap;background:#0f172a;color:#d8f3e7;padding:13px;border-radius:10px;max-height:380px;overflow:auto}</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script src="js/cloud-auth.js?v=15.0"></script><script src="js/cloud-session.js?v=16.0"></script><script src="js/cloud-session-guard.js?v=16.0"></script><script src="js/offline-queue.js?v=17.0"></script><script src="js/recovery-service.js?v=17.0"></script>

<body><main class="wrap"><section class="card"><h1>TAHAP 17 — Recovery Test</h1><p>Pemeriksaan ini hanya membaca konfigurasi, queue lokal, dan conflict cloud. Tidak membuat transaksi atau melakukan discard.</p><div class="row"><button id="run">Jalankan Pemeriksaan</button><a href="recovery-center.html">Recovery Center</a><a href="dashboard.html">Dashboard</a></div></section><section class="card"><h2>Hasil</h2><div id="result"><span class="badge warn">Belum diperiksa</span></div></section><section class="card"><h2>Log</h2><pre id="log">Siap.</pre></section></main>
<script>
(function(){"use strict";const result=document.getElementById("result"),log=document.getElementById("log");function badge(label,ok){const el=document.createElement("span");el.className=`badge ${ok?"pass":"fail"}`;el.textContent=`${ok?"PASS":"FAIL"} · ${label}`;return el;}document.getElementById("run").onclick=async event=>{event.currentTarget.disabled=true;result.textContent="";log.textContent="Memulai…";const checks=[];try{const context=await LDMCloudSession.ensureAuthenticated({registerDevice:false});checks.push(["Session cloud aktif",Boolean(context?.user?.id)]);checks.push(["Role valid",["owner","admin","kasir"].includes(String(context?.profile?.role||"").toLowerCase())]);checks.push(["Offline Queue v17 API",Boolean(LDMOfflineQueue.retryItem&&LDMOfflineQueue.discardItem)]);checks.push(["Recovery Service v17",LDMRecovery.version==="17.0.0"]);const {data:meta,error:metaError}=await LDMSupabase.createClient().from("ldm_system_meta").select("key,value").in("key",["live_sync_stage","schema_version","schema_status","sync_conflict_authority"]);if(metaError)throw metaError;const map=Object.fromEntries((meta||[]).map(row=>[row.key,row.value]));checks.push(["Database live_sync_stage 17",map.live_sync_stage==="17"]);checks.push(["Schema recovery siap",map.schema_status==="sync_conflict_recovery_ready"]);checks.push(["Authority sync_conflicts",map.sync_conflict_authority==="public.sync_conflicts"]);const local=await LDMOfflineQueue.list();checks.push(["Queue lokal dapat dibaca",Array.isArray(local)]);const cloud=await LDMRecovery.listCloud({limit:10});checks.push(["Conflict cloud dapat dibaca",Array.isArray(cloud.rows)]);log.textContent=JSON.stringify({identity:{username:context.profile.username,role:context.profile.role,store_id:context.profile.store_id},metadata:map,local_rows:local.length,cloud_rows:cloud.rows.length},null,2);}catch(error){checks.push(["Pemeriksaan tanpa error",false]);log.textContent=JSON.stringify({message:error.message||String(error),details:error.details,hint:error.hint},null,2);}checks.forEach(([label,ok])=>result.appendChild(badge(label,ok)));event.currentTarget.disabled=false;};})();
</script></body></html>
