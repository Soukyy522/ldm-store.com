<!DOCTYPE html>
<html lang="id">
<head>
    <script src="js/storage-engine.js?v=27.7.0"></script>
    <script src="js/storage-quota-guard.js?v=27.7.0"></script>
    <script defer src="js/storage-health-monitor.js?v=27.7.0"></script>
<script src="js/local-time.js?v=26.4.0"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0F9D58">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icons/icon-192.png">
    <title>Offline - LocDailyMar</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#eef7f1;color:#233142;font-family:Inter,system-ui,sans-serif}.card{width:min(520px,100%);background:#fff;border-radius:24px;padding:30px;text-align:center;box-shadow:0 18px 50px #22334422}.logo{width:92px;height:92px;border-radius:24px}.badge{display:inline-block;margin-top:15px;padding:7px 12px;border-radius:99px;background:#fff3cd;color:#765b00;font-weight:800}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}.actions a,.actions button{border:0;border-radius:11px;padding:12px 17px;text-decoration:none;font-weight:800;cursor:pointer}.primary{background:#0f9d58;color:#fff}.secondary{background:#e7eef4;color:#233142}p{line-height:1.6;color:#5b6875}#status.online{background:#d9f7e6;color:#08783e}
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="assets/icons/icon-192.png" alt="Ikon LocDailyMar">
        <div class="badge" id="status">Perangkat sedang offline</div>
        <h1>Halaman belum tersedia offline</h1>
        <p>Kasir yang pernah dibuka tetap dapat digunakan sesuai aturan Offline Queue. Halaman lain memerlukan internet agar data cloud tetap akurat.</p>
        <div class="actions">
            <a class="primary" href="kasir.html">Buka Kasir</a>
            <button class="secondary" type="button" onclick="location.reload()">Coba Lagi</button>
        </div>
    </main>
    <script>
        function refreshStatus(){
            const status=document.getElementById("status");
            status.textContent=navigator.onLine?"Internet kembali tersambung":"Perangkat sedang offline";
            status.classList.toggle("online",navigator.onLine);
        }
        addEventListener("online",refreshStatus);addEventListener("offline",refreshStatus);refreshStatus();
    </script>
</body>
</html>
