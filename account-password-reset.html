<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password - LocDailyMar</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#f4f7fb;color:#172033;font-family:Inter,Arial,sans-serif}.card{width:min(480px,100%);background:white;border:1px solid #e4e7ec;border-radius:18px;padding:20px;box-shadow:0 12px 32px rgba(16,24,40,.08)}h1{font-size:1.3rem;margin:0 0 6px}p{font-size:.78rem;color:#667085;line-height:1.55}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}label{font-size:.72rem;font-weight:750}input{min-height:44px;border:1px solid #d0d5dd;border-radius:9px;padding:10px;font:inherit}button,a{width:100%;min-height:44px;border:0;border-radius:9px;padding:10px;font-weight:800;background:#0d2240;color:white;text-decoration:none;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:8px}.secondary{background:white;color:#172033;border:1px solid #e4e7ec}.msg{font-size:.76rem;white-space:pre-wrap;margin-top:12px}.error{color:#b42318}.ok{color:#166534}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/license-v2-config.js?v=24.0.0"></script>
<script src="js/license-v2-client.js?v=24.0.0"></script>
<script defer src="js/license-v2-guard.js?v=24.0.0"></script>
</head>
<body>
<div class="card">
  <h1>🔑 Buat Password Baru</h1>
  <p>Halaman ini dipakai setelah membuka link recovery dari email Supabase Auth.</p>
  <div id="formBox" style="display:none">
    <div class="field"><label>Password Baru</label><input id="password1" type="password" minlength="8" autocomplete="new-password"></div>
    <div class="field"><label>Ulangi Password</label><input id="password2" type="password" minlength="8" autocomplete="new-password"></div>
    <button onclick="savePassword()">Simpan Password Baru</button>
  </div>
  <div id="message" class="msg">Memeriksa recovery session...</div>
  <a class="secondary" href="index.html">← Kembali ke Login</a>
</div>
<script>
let recoveryReady=false;
function message(text,type=""){const el=document.getElementById("message");el.textContent=text;el.className="msg "+type}
function ready(){recoveryReady=true;document.getElementById("formBox").style.display="block";message("Recovery session valid. Masukkan password baru.","ok")}
async function inspect(){try{if(!window.LDMSupabase||!LDMSupabase.isConfigured())throw new Error("Supabase belum dikonfigurasi.");const client=LDMSupabase.createClient();client.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session)ready()});const {data,error}=await client.auth.getSession();if(error)throw error;if(data&&data.session)ready();else setTimeout(async()=>{const r=await client.auth.getSession();if(r.data&&r.data.session)ready();else message("Recovery session belum ditemukan. Pastikan halaman ini dibuka dari link reset password terbaru pada email.","error")},900)}catch(e){message("❌ "+(e.message||String(e)),"error")}}
async function savePassword(){if(!recoveryReady){message("Recovery session belum valid.","error");return}const a=document.getElementById("password1").value;const b=document.getElementById("password2").value;if(a.length<8){message("Password minimal 8 karakter.","error");return}if(a!==b){message("Konfirmasi password tidak sama.","error");return}try{const client=LDMSupabase.createClient();const {error}=await client.auth.updateUser({password:a});if(error)throw error;await client.auth.signOut();document.getElementById("formBox").style.display="none";message("✅ Password berhasil diubah. Silakan kembali ke halaman Login.","ok")}catch(e){message("❌ "+(e.message||String(e)),"error")}}
document.addEventListener("DOMContentLoaded",inspect);
</script>
</body>
</html>
