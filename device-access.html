<!DOCTYPE html><html lang="id"><head>
<script src="js/local-time.js?v=26.4.0"></script><meta name="referrer" content="strict-origin-when-cross-origin"><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><script src="js/security-hardening.js?v=19.0"></script><script defer src="js/qa-runtime.js?v=19.0"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Akses Perangkat - LocDailyMar</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;display:grid;min-height:100vh;place-items:center}.card{width:min(620px,calc(100% - 24px));background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(16,24,40,.08)}h1{font-size:1.3rem}.code{padding:12px;background:#f8fafc;border:1px dashed #94a3b8;border-radius:10px;font-family:monospace;overflow-wrap:anywhere}.status{font-weight:800}.pending{color:#b45309}.revoked{color:#b42318}.active{color:#15803d}button{border:0;border-radius:9px;padding:10px 14px;background:#0d2240;color:white;font-weight:700;cursor:pointer;margin-right:6px}p{font-size:.8rem;color:#667085;line-height:1.6}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script src="js/cloud-auth.js?v=15.0"></script><script src="js/cloud-session.js?v=6.0"></script><script src="js/license-v2-config.js?v=25.2.0"></script>
<script src="js/license-v2-client.js?v=25.2.0"></script>
<script defer src="js/license-v2-guard.js?v=25.2.0"></script>
</head><body><div class="card"><h1>🔗 Status Perangkat Cloud</h1><p>Perangkat ini sudah terdaftar, tetapi akses aplikasi mengikuti persetujuan Owner.</p><div class="code" id="code">Memuat Device ID...</div><p>Status: <span id="status" class="status">...</span></p><p id="info"></p><button onclick="check()">↻ Cek Lagi</button><button onclick="logout()">Keluar</button></div><script>
async function check(){try{await LDMCloudSession.ensureAuthenticated({registerDevice:true});const a=await LDMCloudAuth.getCurrentDeviceAccess();document.getElementById("code").textContent=a.client_device_id||"-";const s=String(a.status||"unknown").toLowerCase();document.getElementById("status").textContent=s.toUpperCase();document.getElementById("status").className="status "+s;if(s==="active"){document.getElementById("info").textContent="Perangkat sudah dihubungkan. Mengarahkan ke Dashboard...";setTimeout(()=>location.replace("dashboard.html"),600)}else if(s==="pending"){document.getElementById("info").textContent="Menunggu Owner membuka Perangkat Cloud di Device A lalu menekan Hubungkan pada Device ID ini."}else if(s==="revoked"){document.getElementById("info").textContent="Hubungan perangkat telah diputuskan oleh Owner. Owner dapat menghubungkannya kembali dari menu Perangkat Cloud."}else{document.getElementById("info").textContent="Status perangkat belum dikenali."}}catch(e){document.getElementById("info").textContent="Gagal membaca status: "+(e.message||String(e))}}
async function logout(){await LDMCloudSession.logout("index.html")}
document.addEventListener("DOMContentLoaded",()=>{check();setInterval(check,5000)});
</script></body></html>
