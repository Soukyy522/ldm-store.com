</head><body><div class="wrap"><div class="card"><h1>🧪 Tahap 14 - Account Test</h1><p>Read-only smoke test untuk account authority. Tidak membuat/mengubah akun.</p><button onclick="run()">Jalankan Test</button><a href="account-management.html">Akun Cloud</a><a href="dashboard.html">Dashboard</a></div><div class="card"><pre id="out">Belum dijalankan.</pre></div></div><script>
async function run(){const el=document.getElementById("out");try{const ctx=await LDMAccounts.ownerContext();const [rows,h]=await Promise.all([LDMAccounts.listAccounts(),LDMAccounts.health()]);el.textContent=["✅ TAHAP 14 ACCOUNT AUTHORITY OK","",`User: ${ctx.profile.username}`,`Role: ${ctx.profile.role}`,`Store: ${ctx.profile.store_code}`,`Profiles: ${rows.length}`,`Active: ${h.active_profiles}`,`Owners: ${h.active_owners}`,`Admins: ${h.active_admins}`,`Cashiers: ${h.active_cashiers}`,"",...rows.map(r=>`${r.username} | ${r.role} | ${r.active?"ACTIVE":"INACTIVE"} | ${r.email}`)].join("\n")}catch(e){el.textContent="❌ TEST GAGAL\n\n"+(e.message||String(e))}}
document.addEventListener("DOMContentLoaded",run);
</script></body></html>
